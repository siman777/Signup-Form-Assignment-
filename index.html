<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and user-friendly sign-up form for creating a new account.">

    <title>Sign Up Form</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <header id="header">
        <h1 class="head">Signup</h1>
    </header>
    <main id="main">
        <form action="#">
            <input type="text" placeholder="Full Name" name="name" required>
            <br>
            <input type="email" placeholder="Email" name="email" required>
            <br>
            <input type="password" placeholder="Password" name="password" required>
            <br>
            <input type="password" placeholder="Confirm password" name="Confirm password" required>
            <br>
            <input type="date" placeholder="dd-mm-yyyy" name="dob" required>
            <br>
            <label for="stu">
                <input type="radio" id="stu" name="profession" value="student" required>
                Student
            </label>
            <label for="prof"><input type="radio" id="prof" name="profession" value="Employee" required>
                Employee
            </label>
            <br>
            <input type="checkbox" name="term-and-condition" value="accept" required>
            agree to all the Terms and conditions
            <br>
            <button type="submit">Signup</button>
        </form>
    </main>
    <footer>
    </footer>
</body>

</html>
